<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" fill="none">
  <!-- Left WR Icon scaled -->
  <g transform="translate(10, 0)">
    <!-- W Monogram -->
    <g fill="#FFFFFF" stroke="#BAC9CC" stroke-width="1.2" stroke-linejoin="round">
      <polygon points="12,50 38,50 94,188 68,188" />
      <polygon points="68,188 94,188 132,94 108,94" />
      <polygon points="108,94 132,94 172,188 146,188" />
      <polygon points="146,188 172,188 200,120 178,120" />
    </g>

    <!-- Cyan R Monogram -->
    <g fill="#4CE5EB">
      <path fill-rule="evenodd" d="
        M 74 50
        L 208 50
        C 236 50 252 64 252 88
        C 252 110 236 122 208 122
        L 152 122
        L 152 188
        L 122 188
        L 122 50
        L 74 50 Z

        M 152 74
        L 204 74
        C 218 74 224 78 224 88
        C 224 96 218 100 204 100
        L 152 100
        L 152 74 Z
      " />
      <polygon points="178,120 210,120 248,188 214,188" />
    </g>
  </g>

  <!-- Typography Right -->
  <g transform="translate(300, 56)">
    <!-- WAGNER ROCHA -->
    <text
      x="0"
      y="50"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="58"
      letter-spacing="12"
      font-style="italic"
    >
      WAGNER ROCHA
    </text>

    <!-- Instagram Icon + Handle -->
    <g transform="translate(6, 82)">
      <!-- Instagram Glyph in Aqua Cyan -->
      <rect x="0" y="0" width="34" height="34" rx="10" ry="10" fill="none" stroke="#4CE5EB" stroke-width="3.2" />
      <circle cx="17" cy="17" r="8" fill="none" stroke="#4CE5EB" stroke-width="3.2" />
      <circle cx="25.5" cy="8.5" r="1.8" fill="#4CE5EB" />

      <!-- Handle Text -->
      <text
        x="48"
        y="26"
        fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="32"
        letter-spacing="1.2"
      >
        @treinador.wagner
      </text>
    </g>
  </g>
</svg>
