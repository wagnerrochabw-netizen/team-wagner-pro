<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="520" height="480" fill="none">
  <!-- W Monogram (White outlined faceted slanted bands) -->
  <g fill="#FFFFFF" stroke="#BAC9CC" stroke-width="1.2" stroke-linejoin="round">
    <!-- Left slant -->
    <polygon points="12,50 38,50 94,188 68,188" />
    <!-- Middle-left up slant -->
    <polygon points="68,188 94,188 132,94 108,94" />
    <!-- Middle-right down slant -->
    <polygon points="108,94 132,94 172,188 146,188" />
    <!-- Right up slant -->
    <polygon points="146,188 172,188 200,120 178,120" />
  </g>

  <!-- Cyan R Monogram (Vibrant Aqua #4CE5EB overlapping the W) -->
  <g fill="#4CE5EB">
    <!-- Top Bar & Bowl with Inner Capsule Slot -->
    <path fill-rule="evenodd" d="
      M 74 50
      L 208 50
      C 236 50 252 64 252 88
      C 252 110 236 122 208 122
      L 152 122
      L 152 188
      L 122 188
      L 122 50
      L 74 50 Z

      M 152 74
      L 204 74
      C 218 74 224 78 224 88
      C 224 96 218 100 204 100
      L 152 100
      L 152 74 Z
    " />

    <!-- Slanted Right Leg -->
    <polygon points="178,120 210,120 248,188 214,188" />
  </g>
</svg>
