<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 190' width='1760' height='380'>
  <defs>
    <filter id='cyan-glow-banner' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='0' stdDeviation='5' flood-color='#74CDD6' flood-opacity='0.4'/>
    </filter>
  </defs>

  <!-- Left WR Symbol Scaled -->
  <g transform='translate(10, 8) scale(0.88)'>
    <!-- W Monogram -->
    <g fill='#FFFFFF' stroke='#BAC9CC' stroke-width='0.8'>
      <polygon points='12,44 26,44 76,165 62,165' />
      <polygon points='62,165 76,165 106,94 92,94' />
      <polygon points='92,94 106,94 136,165 122,165' />
      <polygon points='122,165 136,165 156,112 142,112' />
    </g>

    <!-- Cyan R Shape -->
    <path fill-rule='evenodd' fill='#74CDD6' filter='url(#cyan-glow-banner)' d='
      M 68 44 
      L 165 44 
      C 188 44 198 56 198 76 
      C 198 94 188 106 162 106 
      L 142 106 
      L 174 165 
      L 146 165 
      L 118 106 
      L 80 106 
      L 80 72 
      L 160 72 
      C 172 72 174 74 174 76 
      C 174 78 172 80 160 80 
      L 78 80 
      L 68 44 Z
      
      M 100 68 
      L 160 68 
      C 172 68 175 72 175 76 
      C 175 80 172 84 160 84 
      L 100 84 Z' />
  </g>

  <!-- Typography Right -->
  <g transform='translate(210, 46)'>
    <!-- WAGNER ROCHA -->
    <text x='0' y='42' fill='#FFFFFF' font-family='sans-serif' font-weight='900' font-size='48' letter-spacing='9' style='font-style: italic;'>
      WAGNER ROCHA
    </text>

    <!-- Instagram Icon + Handle -->
    <g transform='translate(2, 60)'>
      <!-- Instagram Glyph in Aqua Cyan -->
      <rect x='0' y='0' width='28' height='28' rx='8' ry='8' fill='none' stroke='#74CDD6' stroke-width='2.8' />
      <circle cx='14' cy='14' r='6.5' fill='none' stroke='#74CDD6' stroke-width='2.8' />
      <circle cx='21' cy='7' r='1.5' fill='#74CDD6' />

      <!-- Handle Text -->
      <text x='38' y='22' fill='#E1E2EB' font-family='sans-serif' font-weight='500' font-size='26' letter-spacing='0.5'>
        @treinador.wagner
      </text>
    </g>
  </g>
</svg>